<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi ↔ USDT Swap Information</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b12;
      color: white;
      line-height: 1.6;
    }

    header {
      background: #111827;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 1px solid #293241;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #f5b942;
    }

    header p {
      color: #aeb7c6;
      margin-top: 5px;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background:
        radial-gradient(circle at top, #3a2b5c 0%, #111827 45%, #080b12 100%);
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #f5b942;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #c9d0dc;
    }

    .buttons {
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 13px 24px;
      margin: 6px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      background: #f5b942;
      color: #111;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid #f5b942;
      color: #f5b942;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #121925;
      border: 1px solid #263244;
      border-radius: 15px;
      padding: 25px;
    }

    .card h3 {
      color: #f5b942;
      margin-bottom: 10px;
    }

    .steps {
      counter-reset: step;
    }

    .step {
      background: #121925;
      margin: 14px 0;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #f5b942;
    }

    .step strong {
      color: #f5b942;
    }

    .notice {
      margin-top: 30px;
      padding: 18px;
      background: #171d29;
      border-radius: 12px;
      border: 1px solid #394454;
      color: #cbd3df;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      background: #05070b;
      color: #8791a1;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 30px;
      }
